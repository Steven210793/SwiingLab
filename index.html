<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SwiingLab</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SwiingLab">
<meta name="theme-color" content="#0a0908">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;650;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

:root{
  --bg-0:#0a0908;
  --bg-1:#0d0c0a;
  --glass:rgba(255,255,255,0.045);
  --glass-2:rgba(255,255,255,0.02);
  --border:rgba(255,255,255,0.09);
  --border-soft:rgba(255,255,255,0.055);
  --gold:#e3b34a;
  --gold-light:#f3d98b;
  --gold-dark:#b8892f;
  --text:#f2e9d8;
  --muted:#a49a89;
  --ok:#4cb07e;
  --ok-bg:rgba(76,176,126,0.13);
  --ok-bd:rgba(76,176,126,0.4);
  --no:#d97066;
  --no-bg:rgba(217,112,102,0.13);
  --no-bd:rgba(217,112,102,0.4);
  --shadow:0 12px 34px rgba(0,0,0,0.45);
  --radius:20px;
  --bg-grad-1:#1c1712;
  --bg-grad-2:#161310;
  --thumb-bg:#141210;
  --text-soft:#a9c2b6;
  --text-soft-2:#d7e4dc;
  --nav-bg:rgba(18,16,13,0.72);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

:root[data-theme="light"]{
  --bg-0:#f7f2e6;
  --bg-1:#f2ecdc;
  --glass:rgba(30,25,15,0.04);
  --glass-2:rgba(30,25,15,0.02);
  --border:rgba(30,25,15,0.12);
  --border-soft:rgba(30,25,15,0.07);
  --gold:#b8892f;
  --gold-light:#a97927;
  --gold-dark:#8f6a22;
  --text:#221d15;
  --muted:#786d59;
  --ok:#2f8a5e;
  --ok-bg:rgba(47,138,94,0.12);
  --ok-bd:rgba(47,138,94,0.4);
  --no:#c14f42;
  --no-bg:rgba(193,79,66,0.12);
  --no-bd:rgba(193,79,66,0.4);
  --shadow:0 12px 30px rgba(60,50,30,0.12);
  --bg-grad-1:#fffaf0;
  --bg-grad-2:#f1e6cd;
  --thumb-bg:#0a0908;
  --text-soft:#5f6f5a;
  --text-soft-2:#46564a;
  --nav-bg:rgba(255,250,240,0.82);
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1100px 620px at 50% -8%, var(--bg-grad-1) 0%, rgba(28,23,18,0) 60%),
    radial-gradient(800px 560px at 105% 105%, var(--bg-grad-2) 0%, rgba(22,19,16,0) 55%),
    var(--bg-0);
  background-attachment:fixed;
  color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding:26px 18px 128px
}


.top{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Sora',-apple-system,sans-serif
}

.logo .word{
  font-weight:700;
  font-size:23px;
  letter-spacing:0.005em;
  color:var(--text)
}

.logo .word b{
  color:var(--gold);
  font-weight:700
}

.pill{
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:99px;
  padding:8px 13px;
  color:var(--text);
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap
}

.hero{
  padding:30px 0 20px
}

.hero h1,h1{
  font-family:'Sora',-apple-system,sans-serif;
  font-size:28px;
  font-weight:700;
  letter-spacing:-0.01em;
  margin:0 0 8px
}

.muted{
  color:var(--muted)
}

.modes,.zoneMenu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.card,.menuCard{
  background:linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.014));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  cursor:pointer;
  box-shadow:var(--shadow)
}

.card b,.menuCard b{
  display:block;
  font-family:'Sora',-apple-system,sans-serif;
  font-weight:650;
  font-size:17px;
  margin-bottom:4px;
  letter-spacing:-0.005em
}

.clubs{
  display:block;
  color:var(--text-soft);
  font-size:12px;
  min-height:32px;
  margin:5px 0
}

.bar{
  height:6px;
  background:rgba(255,255,255,0.07);
  border-radius:9px;
  margin-top:12px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--gold-dark),var(--gold) 55%,var(--gold-light))
}

.section{
  margin-top:28px
}

.section h2{
  font-family:'Sora',-apple-system,sans-serif;
  font-size:19px;
  font-weight:650;
  letter-spacing:-0.005em
}

.exercise{
  display:flex;
  gap:12px;
  align-items:center;
  margin:10px 0;
  background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:18px;
  padding:10px;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,0.32)
}

.thumb{
  width:90px;
  height:72px;
  background:var(--thumb-bg);
  border-radius:13px;
  overflow:hidden;
  flex:none
}

.exercise b{
  display:block;
  font-weight:650
}

.tag{
  font-size:12px;
  color:var(--gold-light)
}

.back{
  cursor:pointer;
  color:var(--text-soft);
  margin-bottom:20px;
  font-weight:600
}

.diagram{
  background:linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-soft);
  border-radius:22px;
  padding:12px;
  margin:18px 0;
  box-shadow:var(--shadow)
}

.info{
  background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 8px 22px rgba(0,0,0,0.32)
}

.info h3{
  margin:0 0 7px;
  font-size:12.5px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--gold-light);
  font-weight:700
}

.info p{
  margin:0;
  line-height:1.55
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0
}

.metric{
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:10px;
  text-align:center
}

.metric b{
  display:block;
  font-size:18px;
  font-family:'Sora',sans-serif;
  font-weight:700
}

.primary{
  width:100%;
  border:0;
  background:linear-gradient(135deg,var(--gold-light),var(--gold) 60%,var(--gold-dark));
  color:#191207;
  font-weight:750;
  padding:15px;
  border-radius:15px;
  font-size:16px;
  box-shadow:0 10px 26px rgba(227,179,74,0.22), inset 0 1px 0 rgba(255,255,255,0.35);
  letter-spacing:0.01em
}

.hidden{
  display:none
}

.play{
  text-align:center;
  padding-top:20px
}

.ballNo{
  font-size:18px;
  color:var(--muted);
  margin:20px
}

.choice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.choice button{
  height:120px;
  border:1px solid transparent;
  border-radius:20px;
  color:white;
  font-size:19px;
  font-weight:750;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px)
}

.ok{
  background:var(--ok-bg);
  border-color:var(--ok-bd);
  color:var(--ok)
}

.no{
  background:var(--no-bg);
  border-color:var(--no-bd);
  color:var(--no)
}

.score{
  font-size:15px;
  margin:20px 0
}

.statsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px
}

.stat{
  background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  box-shadow:0 8px 22px rgba(0,0,0,0.32)
}

.stat strong{
  display:block;

function levelThreshold(n){
  return Math.round(80*Math.pow(n,1.5));
}

function getLevelInfo(totalXp){
  let level=1, remaining=totalXp, thresh=levelThreshold(level);
  while(remaining>=thresh){
    remaining-=thresh;
    level++;
    thresh=levelThreshold(level);
  }
  return {level, xpInLevel:remaining, xpForNext:thresh, totalXp};
}

function computeTotalXp(){
  return loadHistory().reduce((sum,s)=>sum+s.xp,0);

function bestStreak(results){
  let max=0,cur=0;
  for(let r of results){
    if(r){cur++;if(cur>max)max=cur;}else cur=0;
  }
  return max;
}

function computeZoneStats(m){
  let sessions=loadHistory().filter(s=>s.zone===m);
  let balls=sessions.reduce((a,s)=>a+s.total,0);
  let ok=sessions.reduce((a,s)=>a+s.ok,0);
  let rate=balls>0?Math.round(ok/balls*100):null;
  let streak=0;
  sessions.forEach(s=>{
    let b=bestStreak(s.results);
    if(b>streak)streak=b;
  });
  return {count:sessions.length,balls,rate,streak,sessions};
}

function computeClubStats(m){
  let opts=clubOptions[m];
  if(!opts)return [];
  return opts.map(c=>{
    let sessions=loadHistory().filter(s=>s.zone===m&&s.club===c);
    let balls=sessions.reduce((a,s)=>a+s.total,0);
    let ok=sessions.reduce((a,s)=>a+s.ok,0);
    let rate=balls>0?Math.round(ok/balls*100):0;
    return {club:c,rate,balls};
  });
}

// ===================== FLÈCHE DE DISTANCE (SVG) =====================

function dArrow(x1,y1,x2,y2,color){
color=color||'#e3b34a';
let dx=x2-x1,dy=y2-y1;
let len=Math.sqrt(dx*dx+dy*dy)||1;
let ux=dx/len,uy=dy/len;
let ah=6,aw=3.2;
let px=-uy,py=ux;
function head(bx,by,dx2,dy2){
let backx=bx-dx2*ah,backy=by-dy2*ah;
let lx=backx+px*aw,ly=backy+py*aw;
let rx=backx-px*aw,ry=backy-py*aw;
return `<polygon points="${bx},${by} ${lx.toFixed(1)},${ly.toFixed(1)} ${rx.toFixed(1)},${ry.toFixed(1)}" fill="${color}"/>`;
}
return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="1.4"/>${head(x1,y1,-ux,-uy)}${head(x2,y2,ux,uy)}`;
}

if(ex.subChoice&&!selectedSubChoice[ex.id])selectedSubChoice[ex.id]=ex.subChoice.options[0];
if(ex.needsDistance&&selectedDistanceVal[ex.id]===undefined)selectedDistanceVal[ex.id]=ex.distanceDefault;

let d=getClubDistance(selectedClub[ex.id]);
selectedDistanceVal[ex.id]=(d!==null)?d:140;
}

let diagramHtml;
if(ex.id==='appTrajectoire')diagramHtml=diagramTrajUnique(selectedSubChoice[ex.id]);
else if(ex.id==='appPrecision')diagramHtml=diagramApproachZone(selectedDistanceVal[ex.id]);

Total

${ex.description}
</p>

let playState={};

function start(m,i){

let ex=exercises[m][i];
let club=selectedClub[ex.id]||ex.clubs[0];

if(ex.kind==='measure'){
let ballLabels=[];
ex.groups.forEach(g=>{for(let k=0;k<g.balls;k++)ballLabels.push(g.label);});
playState={
m,i,kind:'measure',n:1,total:ballLabels.length,ballLabels,
club,distances:[],
startTime:Date.now()
};
renderPlay();
return;
}

let total=ex.kind==='ordered'?ex.groups.reduce((a,g)=>a+g.balls,0):ex.totalBalls;

let subChoice=ex.subChoice?selectedSubChoice[ex.id]:null;

let refDist=null,rangeLow=null,rangeHigh=null;
if(ex.needsRefDistance){
refDist=selectedDistanceVal[ex.id]||140;
rangeLow=refDist-ex.tolerance;
rangeHigh=refDist+ex.tolerance;
}

let playDist=ex.needsDistance?(selectedDistanceVal[ex.id]||ex.distanceDefault):null;

let groupLabels=null;
if(ex.kind==='ordered'){
groupLabels=[];
ex.groups.forEach(g=>{for(let k=0;k<g.balls;k++)groupLabels.push(g.label);});
}

playState={
m,i,kind:ex.kind,n:1,ok:0,no:0,total,results:[],
club,subChoice,refDist,rangeLow,rangeHigh,playDist,groupLabels,
startTime:Date.now()
};

renderPlay();
}

let p=playState;
let ex=exercises[p.m][p.i];

if(p.kind==='measure'){
S.innerHTML=`

</h1>

${p.n} / ${p.total}
</div>

${subLabel}
${distInfo}

<div class="choice">

<button class="ok"

✓<br>
Réussie
</button>

<button class="no"
onclick="hit(false)">
×<br>
Ratée
</button>

Réussies :
<b>${p.ok}</b>

Ratées :

function hit(ok){

let p=playState;

p.results.push(ok);

if(ok){
p.ok++;
}else{
p.no++;
}

if(p.n>=p.total){
finish();
return;
}

p.n++;

renderPlay();
}

function hitMeasure(){
let p=playState;
let el=document.getElementById('measureInput');
let val=parseFloat(el?el.value:0)||0;
p.distances.push(val);

if(p.n>=p.total){
finishMeasure();
return;
}

p.n++;
renderPlay();
}

function finish(){

let p=playState;
let ex=exercises[p.m][p.i];

let rate=
Math.round(
p.ok/p.total*100
);

let hasTarget=typeof ex.target==='number';
let validated=hasTarget?(p.ok>=ex.target):null;
let bonus=validated===true?BONUS_XP:(!hasTarget&&rate>=BONUS_THRESHOLD?BONUS_XP:0);
let xp=p.ok*XP_PER_BALL+bonus;
let duration=Math.round((Date.now()-p.startTime)/1000);

saveSession({
date:new Date().toISOString(),
zone:p.m,
exercise:ex.nom,
club:p.club,
results:p.results,
ok:p.ok,
no:p.no,
total:p.total,
rate,
xp,
duration,
validated:validated===null?undefined:validated
});

let titleTxt=validated===true?'Validé ✓':'Résultat';
let bonusTxt=bonus>0?(hasTarget?` (dont ${bonus} bonus exercice validé)`:` (dont ${bonus} bonus régularité ≥ ${BONUS_THRESHOLD}%)`):'';

S.innerHTML=`

</div>

<strong>${rate}%</strong>
</div>

</div>

+${xp} XP${bonusTxt}
</p>

onclick="zone('${p.m}')">

setActiveTab('exercices');
}

function finishMeasure(){

let p=playState;
let ex=exercises[p.m][p.i];

let xp=p.total*XP_PER_BALL;
let duration=Math.round((Date.now()-p.startTime)/1000);

let recap=[];
let idx=0;
ex.groups.forEach(g=>{
let vals=p.distances.slice(idx,idx+g.balls);
idx+=g.balls;
let avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
recap.push({label:g.label,avg,vals});
});

saveSession({
date:new Date().toISOString(),
zone:p.m,
exercise:ex.nom,
club:p.club,
results:[],
ok:p.total,
no:0,
total:p.total,
rate:100,
xp,
duration,
measure:true,
distances:p.distances
});

S.innerHTML=`

<div class="play">

<span class="tag">
EXERCICE TERMINÉ
</span>

<h1>Résultat</h1>

${recap.map(r=>`
<div class="info">

<p>Distance moyenne : ${r.avg} m<br><span class="muted">${r.vals.join(' m · ')} m</span></p>
</div>
`).join('')}

<div class="info section">
<h3>XP GAGNÉ</h3>
<p>
+${xp} XP
</p>
</div>

<div class="section">

<button class="primary"
onclick="zone('${p.m}')">
Terminer
</button>

</div>

</div>`;

setActiveTab('exercices');
}

// ===================== JEU PUTTING =====================

let puttingState={};

function startPutting(id){

let e=puttingById(id);

if(e.type==='sequence'){
puttingState={
id,type:'sequence',
round:1,maxRounds:e.maxRounds,idx:0,distances:e.distances,
ok:0,no:0,results:[],validated:false,
startTime:Date.now()
};
}else if(e.type==='simple'){
puttingState={
id,type:'simple',
n:1,total:e.totalBalls,target:e.target,
ok:0,no:0,results:[],
startTime:Date.now()
};
}else{
puttingState={
id,type:'tempo',
n:1,total:e.totalBalls,
startTime:Date.now()
};
}

renderPlayPutting();
}

function renderPlayPutting(){

let p=puttingState;
let e=puttingById(p.id);

if(p.type==='tempo'){
S.innerHTML=`

<div class="back"
onclick="confirmQuitPutting()">
← Quitter
</div>

<div class="play">

<span class="tag">
${e.nom}
</span>

<h1>
Balle n°${p.n}
</h1>

<div class="ballNo">
${p.n} / ${p.total} · 3 m
</div>

<div class="phaseLabel">Rythme : « 1 » à la montée · « 2 » au retour</div>

<button class="primary" style="margin-top:22px" onclick="nextTempo()">Balle suivante</button>

</div>`;
setActiveTab('exercices');
return;
}

let headLine='';
let sub='';

if(p.type==='sequence'){
headLine=`Distance : ${p.distances[p.idx]} m`;
sub=`Balle ${p.idx+1} / ${p.distances.length} · série ${p.round} / ${p.maxRounds}`;
}else{
headLine=`Balle n°${p.n}`;
sub=`${p.n} / ${p.total} · 2 m`;
}

S.innerHTML=`

<div class="back"
onclick="confirmQuitPutting()">
← Quitter
</div>

<div class="play">

<span class="tag">
${e.nom}
</span>

<h1>
${headLine}
</h1>

<div class="ballNo">
${sub}
</div>

<div class="choice">

<button class="ok"
onclick="hitPutting(true)">
✓<br>
Réussie
</button>

<button class="no"
onclick="hitPutting(false)">
×<br>
Ratée
</button>

</div>

<div class="score">

Réussies :
<b>${p.ok}</b>

·

Ratées :
<b>${p.no}</b>

</div>

</div>`;

setActiveTab('exercices');
}

function nextTempo(){
let p=puttingState;
if(p.n>=p.total){
finishPutting();
return;
}
p.n++;
renderPlayPutting();
}

function hitPutting(ok){

let p=puttingState;

p.results.push(ok);

if(ok)p.ok++;else p.no++;

if(p.type==='simple'){
if(p.n>=p.total){
finishPutting();
return;
}
p.n++;
renderPlayPutting();
return;
}

// sequence
if(ok){
p.idx++;
if(p.idx>=p.distances.length){
p.validated=true;
finishPutting();
return;
}
}else{
p.idx=0;
p.round++;
if(p.round>p.maxRounds){
finishPutting();
return;
}
}

renderPlayPutting();
}

function finishPutting(){

let p=puttingState;
let e=puttingById(p.id);

let total=p.type==='tempo'?p.total:p.results.length;
let rate=p.type==='tempo'?100:(total>0?Math.round(p.ok/total*100):0);

let validated=null;
if(p.type==='simple')validated=(p.ok>=p.target);
if(p.type==='sequence')validated=!!p.validated;

let mult=MULT[e.niveau]||1;
let xpPerBall=Math.round(XP_PER_BALL*mult);
let bonus=(validated===true)?Math.round(BONUS_XP*mult):0;
let xp=(p.type==='tempo')?Math.round(p.total*xpPerBall):(p.ok*xpPerBall+bonus);
let duration=Math.round((Date.now()-p.startTime)/1000);

saveSession({
date:new Date().toISOString(),
zone:'Putting',
exercise:e.nom,
niveau:e.niveau,
results:p.type==='tempo'?[]:p.results,
ok:p.type==='tempo'?p.total:p.ok,
no:p.type==='tempo'?0:p.no,
total,
rate,
xp,
duration,
validated:validated===null?undefined:validated
});

let titleTxt=validated===true?'Validé ✓':(p.type==='tempo'?'Terminé':'Résultat');

S.innerHTML=`

<div class="play">

<span class="tag">
EXERCICE TERMINÉ
</span>

<h1>${titleTxt}</h1>

${p.type==='tempo'?`
<div class="statsGrid">

<div class="stat">
Balles jouées
<strong>${p.total}</strong>
</div>

<div class="stat">
Durée
<strong>${duration}s</strong>
</div>

</div>
`:`
<div class="statsGrid">

<div class="stat">
Réussies
<strong>${p.ok}</strong>
</div>

<div class="stat">
Ratées
<strong>${p.no}</strong>
</div>

<div class="stat">
Total
<strong>${total}</strong>
</div>

<div class="stat">
Réussite
<strong>${rate}%</strong>
</div>

</div>
`}

<div class="info section">
<h3>XP GAGNÉ</h3>
<p>
+${xp} XP${bonus>0?` (dont ${bonus} bonus exercice validé)`:''}
</p>
</div>

<div class="section">

<button class="primary"
onclick="zone('Putting')">
Terminer
</button>

</div>

</div>`;

setActiveTab('exercices');
}

// ===================== MON SAC — ÉCRAN =====================

function bagScreen(){

let bag=loadBag();

function rowsForZone(zone){
return clubOptions[zone].map(c=>{
let entry=bag[c]||{checked:false,distance:''};
return `
<div class="bagRow">
<label class="bagCheck">
<input type="checkbox" ${entry.checked?'checked':''} onchange="onBagCheck('${c}',this.checked)">
<span>${c}</span>
</label>
<input type="number" class="bagDist" placeholder="m" value="${entry.distance||''}" oninput="onBagDist('${c}',this.value)">
</div>`;
}).join('');
}

S.innerHTML=`

<div class="back" onclick="profile()">
← Profil
</div>

<h1>Mon sac</h1>

<div class="muted">
Coche les clubs que tu as dans ton sac. Ajoute ta distance moyenne pour chacun, facultatif.
</div>

${zonesOrder.map(zone=>`
<div class="section">
<h2>${zone}</h2>
<div class="info">
${rowsForZone(zone)}
</div>
</div>
`).join('')}

<button class="primary" style="margin-top:20px" onclick="profile()">
Valider
</button>`;

setActiveTab('profil');
}

function onBagCheck(club,checked){
let bag=loadBag();
if(!bag[club])bag[club]={checked:false,distance:''};
bag[club].checked=checked;
saveBag(bag);
}

function onBagDist(club,val){
let bag=loadBag();
if(!bag[club])bag[club]={checked:false,distance:''};
bag[club].distance=val?parseFloat(val):'';
saveBag(bag);
}

// ===================== THÈME CLAIR / SOMBRE =====================

function loadTheme(){
  try{
    return localStorage.getItem('mag_theme')||'dark';
  }catch(e){
    return 'dark';
  }
}

function saveTheme(t){
  try{
    localStorage.setItem('mag_theme',t);
  }catch(e){}
}

function applyTheme(){
  if(loadTheme()==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
}

function toggleTheme(){
  saveTheme(loadTheme()==='light'?'dark':'light');
  applyTheme();
  profile();
}

let profileSaveTimer=null;

function onProfileChange(){
if(profileSaveTimer)clearTimeout(profileSaveTimer);
profileSaveTimer=setTimeout(()=>{
let name=document.getElementById('pName').value;
let index=document.getElementById('pIndex').value;
saveProfile({name,index});
let note=document.getElementById('saveNote');
if(note){
note.textContent='Enregistré ✓';
setTimeout(()=>{if(note)note.textContent='';},1500);
}
},400);
}

applyTheme();
home();

</script>
