<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SwiingLab | Performance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="swiinglab-icon.svg">


<link rel="apple-touch-icon" href="swiinglab-icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SwiingLab">
<meta name="theme-color" content="#00563b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;650;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

:root{
  --bg-0:#080808;
  --bg-1:#0c0c0c;
  --glass:rgba(255,255,255,0.045);
  --glass-2:rgba(255,255,255,0.02);
  --border:rgba(255,255,255,0.09);
  --border-soft:rgba(255,255,255,0.055);
  --gold:#e3b34a;
  --gold-light:#f3d98b;
  --gold-dark:#b8892f;
  --text:#f2e9d8;
  --muted:#a49a89;
  --ok:#4cb07e;
  --ok-bg:rgba(76,176,126,0.13);
  --ok-bd:rgba(76,176,126,0.4);
  --no:#d97066;
  --no-bg:rgba(217,112,102,0.13);
  --no-bd:rgba(217,112,102,0.4);
  --shadow:0 12px 34px rgba(0,0,0,0.45);
  --radius:20px;
  --bg-grad-1:#1a1a1a;
  --bg-grad-2:#151515;
  --thumb-bg:#141414;
  --text-soft:#a9c2b6;
  --text-soft-2:#d7e4dc;
  --nav-bg:rgba(16,16,16,0.72);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

:root[data-theme="light"]{
  --bg-0:#070c09;
  --bg-1:#0d140f;
  --glass:rgba(255,255,255,0.045);
  --glass-2:rgba(255,255,255,0.02);
  --border:rgba(255,255,255,0.09);
  --border-soft:rgba(255,255,255,0.055);
  --gold:#e3b34a;
  --gold-light:#f3d98b;
  --gold-dark:#b8892f;
  --text:#f2e9d8;
  --muted:#a49a89;
  --ok:#4cb07e;
  --ok-bg:rgba(76,176,126,0.13);
  --ok-bd:rgba(76,176,126,0.4);
  --no:#d97066;
  --no-bg:rgba(217,112,102,0.13);
  --no-bd:rgba(217,112,102,0.4);
  --shadow:0 12px 34px rgba(0,0,0,0.45);
  --bg-grad-1:#142019;
  --bg-grad-2:#0f1a14;
  --thumb-bg:#0a120c;
  --text-soft:#a9c2b6;
  --text-soft-2:#d7e4dc;
  --nav-bg:rgba(10,18,12,0.72);
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1100px 620px at 50% -8%, var(--bg-grad-1) 0%, rgba(28,23,18,0) 60%),
    radial-gradient(800px 560px at 105% 105%, var(--bg-grad-2) 0%, rgba(22,19,16,0) 55%),
    var(--bg-0);
  background-attachment:fixed;
  color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding:26px 18px 128px
}


.top{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Sora',-apple-system,sans-serif
}

.logo .badgeIcon{
  width:42px;
  height:42px;
  border-radius:12px;
  flex:none;
  background-image:url('./icon-192.png');
  background-size:cover;
  background-position:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.45)
}

.logo .word{
  font-weight:700;
  font-size:23px;
  letter-spacing:0.005em;
  color:var(--text)
}

.logo .word b{
  color:var(--gold);
  font-weight:700
}

.pill{
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:99px;
  padding:8px 13px;
  color:var(--text);
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap
}

.hero{
  padding:30px 0 20px
}

.hero h1,h1{
  font-family:'Sora',-apple-system,sans-serif;
  font-size:28px;
  font-weight:700;
  letter-spacing:-0.01em;
  margin:0 0 8px
}

.muted{
  color:var(--muted)
}

.modes,.zoneMenu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.card,.menuCard{
  background:linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.014));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  cursor:pointer;
  box-shadow:var(--shadow)
}

.card b,.menuCard b{
  display:block;
  font-family:'Sora',-apple-system,sans-serif;
  font-weight:650;
  font-size:17px;
  margin-bottom:4px;
  letter-spacing:-0.005em
}

.clubs{
  display:block;
  color:var(--text-soft);
  font-size:12px;
  min-height:32px;
  margin:5px 0
}

.bar{
  height:6px;
  background:rgba(255,255,255,0.07);
  border-radius:9px;
  margin-top:12px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--gold-dark),var(--gold) 55%,var(--gold-light))
}

.section{
  margin-top:28px
}

.section h2{
  font-family:'Sora',-apple-system,sans-serif;
  font-size:19px;
  font-weight:650;
  letter-spacing:-0.005em
}

.exercise{
  display:flex;
  gap:12px;
  align-items:center;
  margin:10px 0;
  background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:18px;
  padding:10px;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,0.32)
}

.thumb{
  width:90px;
  height:72px;
  background:var(--thumb-bg);
  border-radius:13px;
  overflow:hidden;
  flex:none
}

.exercise b{
  display:block;
  font-weight:650
}

.tag{
  font-size:12px;
  color:var(--gold-light)
}

.back{
  cursor:pointer;
  color:var(--text-soft);
  margin-bottom:20px;
  font-weight:600
}

.diagram{
  background:linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-soft);
  border-radius:22px;
  padding:12px;
  margin:18px 0;
  box-shadow:var(--shadow)
}

.info{
  background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 8px 22px rgba(0,0,0,0.32)
}

.info h3{
  margin:0 0 7px;
  font-size:12.5px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--gold-light);
  font-weight:700
}

.info p{
  margin:0;
  line-height:1.55
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0
}

.metric{
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:10px;
  text-align:center
}

.metric b{
  display:block;
  font-size:18px;
  font-family:'Sora',sans-serif;
  font-weight:700
}

.primary{
  width:100%;
  border:0;
  background:linear-gradient(135deg,var(--gold-light),var(--gold) 60%,var(--gold-dark));
  color:#191207;
  font-weight:750;
  padding:15px;
  border-radius:15px;
  font-size:16px;
  box-shadow:0 10px 26px rgba(227,179,74,0.22), inset 0 1px 0 rgba(255,255,255,0.35);
  letter-spacing:0.01em
}

.hidden{
  display:none
}

.play{
  text-align:center;
  padding-top:20px
}

.ballNo{
  font-size:18px;
  color:var(--muted);
  margin:20px
}

.choice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.choice button{
  height:120px;
  border:1px solid transparent;
  border-radius:20px;
  color:white;
  font-size:19px;
  font-weight:750;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px)
}

.ok{
  background:var(--ok-bg);
  border-color:var(--ok-bd);
  color:var(--ok)
}

.no{
  background:var(--no-bg);
  border-color:var(--no-bd);
  color:var(--no)
}

.score{
  font-size:15px;
  margin:20px 0
}

.statsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px
}

.stat{
  background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  box-shadow:0 8px 22px rgba(0,0,0,0.32)
}

.stat strong{
  display:block;
  font-size:24px;
  font-family:'Sora',sans-serif;
  font-weight:700;
  margin-top:5px
}

.histItem{
  background:linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01));
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border-soft);
  border-radius:16px;
  padding:12px 14px;
  margin:8px 0;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.histItem div b{
  display:block;
  font-size:14px;
  font-weight:650
}

.histItem .r{
  text-align:right
}

.histItem .r b{
  font-size:16px;
  color:var(--gold-light)
}

.field{
  margin:14px 0
}

.field label{
  display:block;
  font-size:11.5px;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
  font-weight:650
}

.field input{
  width:100%;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px 14px;
  color:var(--text);
  font-size:15px
}

.field input:focus{
  outline:1.5px solid var(--gold)
}

.saveNote{
  font-size:12px;
  color:var(--gold-light);
  margin-top:6px;
  min-height:14px
}

.distPicker{
  display:flex;
  gap:10px;
  margin:14px 0
}

.distPicker button{
  flex:1;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
  color:var(--text-soft-2);
  padding:12px;
  border-radius:14px;
  font-size:15px;
  font-weight:700
}

.distPicker button.sel{
  background:rgba(227,179,74,0.14);
  border-color:rgba(227,179,74,0.55);
  color:var(--gold-light)
}

.levelRow{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:14px 0;
  flex-wrap:wrap
}

.levelChip{
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
  border-radius:99px;
  padding:6px 12px;
  font-size:12px;
  color:var(--muted)
}

.levelChip.cur{
  background:rgba(227,179,74,0.16);
  border-color:rgba(227,179,74,0.6);
  color:var(--gold-light);
  font-weight:750
}

.levelChip.done{
  color:var(--gold);
  border-color:rgba(227,179,74,0.25)
}

.clubSelect{
  width:100%;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px 14px;
  color:var(--text);
  font-size:15px;
  margin:10px 0
}

.effectBadge{
  display:inline-block;
  background:rgba(227,179,74,0.14);
  border:1px solid rgba(227,179,74,0.55);
  border-radius:99px;
  padding:9px 20px;
  font-size:17px;
  font-weight:750;
  color:var(--gold-light);
  margin:14px 0 4px
}

.phaseLabel{
  color:var(--muted);
  font-size:13px;
  margin:8px 0 0
}

.clubBarRow{
  margin:12px 0
}

.clubBarTop{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:var(--text-soft-2);
  margin-bottom:5px
}

.nav{
  position:fixed;
  z-index:5;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  width:min(452px,calc(100% - 28px));
  background:var(--nav-bg);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);
  border-radius:20px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:5px;
  padding:9px;
  box-shadow:0 14px 34px rgba(0,0,0,0.45)
}

.nav button{
  background:transparent;
  border:1px solid transparent;
  border-radius:14px;
  color:var(--muted);
  padding:10px 2px;
  font-size:12px;
  font-weight:600
}

.nav button .navIcon{display:block;font-size:23px;line-height:1.2;margin-bottom:4px;font-weight:500}
.nav button{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:57px;font-size:11px;padding:6px 2px}
.nav button.active{
  background:rgba(227,179,74,0.14);
  border-color:rgba(227,179,74,0.4);
  color:var(--gold-light);
  font-weight:750
}

svg{
  width:100%;
  height:100%
}

.toggleRow{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.switch{
  position:relative;
  width:48px;
  height:27px;
  background:rgba(255,255,255,0.12);
  border:1px solid var(--border);
  border-radius:99px;
  cursor:pointer;
  flex:none
}

.switch i{
  position:absolute;
  top:2px;
  left:2px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:var(--gold-light);
  transition:left .18s;
  display:block
}

.switch.on{
  background:rgba(227,179,74,0.22);
  border-color:rgba(227,179,74,0.55)
}

.switch.on i{
  left:23px
}

.bagRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--border-soft)
}

.bagRow:last-child{
  border-bottom:none
}

.bagCheck{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14.5px;
  flex:1
}

.bagCheck input[type=checkbox]{
  width:19px;
  height:19px;
  accent-color:var(--gold);
  flex:none
}

.bagDist{
  width:60px;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
  border-radius:10px;
  padding:7px 6px;
  color:var(--text);
  font-size:13px;
  text-align:center;
  flex:none
}

.modalOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:24px
}

.modalBox{
  background:linear-gradient(160deg, rgba(30,26,20,0.98), rgba(18,16,13,0.98));
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  max-width:340px;
  width:100%;
  box-shadow:var(--shadow)
}

.modalBox p{
  margin:0 0 18px;
  font-size:15px;
  line-height:1.5;
  color:var(--text)
}

.modalBtns{
  display:flex;
  gap:10px
}

.modalBtns button{
  flex:1;
  padding:12px;
  border-radius:13px;
  font-weight:700;
  font-size:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--text)
}

.modalBtns button.confirmYes{
  background:linear-gradient(135deg,var(--gold-light),var(--gold) 60%,var(--gold-dark));
  color:#191207;
  border:0
}


.missGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;max-width:440px;margin:24px auto;background:linear-gradient(135deg,#243b21,#36562a);border:1px solid #a9b49b;border-radius:10px;overflow:hidden}.missGrid button,.missTarget{min-height:100px;padding:12px 6px;border:1px solid #a9b49b;color:#fff;background:transparent;font-size:14px}.missTarget{display:flex;align-items:center;justify-content:center;text-align:center;background:#e3b34a33}.wedgeDistances{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.wedgeDistances input{width:100%;min-width:0}.wedgeDistances label{font-size:12px}.historyButton{width:100%;text-align:left;color:inherit;font:inherit;background:transparent;cursor:pointer}.secondary{padding:12px 16px;border:1px solid var(--border,#777);border-radius:9px;background:transparent;color:inherit;min-height:44px}button:disabled{opacity:.45} @media(max-width:360px){.wedgeDistances{grid-template-columns:1fr}}

/* SwiingLab V12: TrackMan and profile refinements */
.v12-badge{font:700 11px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.06em;color:var(--gold);border:1px solid rgba(227,179,74,.35);background:rgba(227,179,74,.08);padding:6px 8px;border-radius:20px}
.tm-session{padding:14px 0;border-bottom:1px solid var(--border-soft)}
.tm-session:last-child{border-bottom:0}
.tm-session-title{font-weight:700;margin-bottom:5px}
.tm-session input[type=date]{display:block;margin-top:8px;width:100%;max-width:250px;padding:10px;color:var(--text);background:var(--bg-1);border:1px solid var(--border);border-radius:10px;color-scheme:dark}
.tm-session .tm-note{font-size:12px;color:var(--muted)}
.tm-table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12px;white-space:nowrap}
.tm-table th,.tm-table td{padding:10px 12px;border-bottom:1px solid var(--border-soft);text-align:right}
.tm-table th:first-child,.tm-table td:first-child{text-align:left;position:sticky;left:0;background:var(--bg-1)}
.tm-badge{display:inline-block;border-radius:12px;padding:2px 9px;border:1px solid var(--border);font-size:11px;color:var(--muted)}
:root{--bg-0:#071e17;--bg-1:#0b3024;--bg-grad-1:#124b35;--bg-grad-2:#0b3929;--gold:#c5a46d;--gold-light:#e6c995;--gold-dark:#967545;--text:#f8f7f2;--muted:#a9c5b5;--nav-bg:rgba(5,34,24,.92)}
:root[data-theme="light"]{--bg-0:#071e17;--bg-1:#0b3024;--bg-grad-1:#124b35;--bg-grad-2:#0b3929;--gold:#c5a46d;--gold-light:#e6c995;--gold-dark:#967545;--text:#f8f7f2;--muted:#a9c5b5;--nav-bg:rgba(5,34,24,.92)}

/* SwiingLab navigation et tableaux de bord */
.slWelcome{padding:29px 24px;background:linear-gradient(145deg,#164c3a,#092e24);border:1px solid rgba(223,189,122,.3);border-radius:26px;margin:4px 0 27px;box-shadow:0 16px 35px #0003}
.slEyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--gold-light)}
.slWelcomeHead{display:flex;align-items:center;gap:16px;margin-top:20px}.slWelcomeHead h1{font-size:clamp(24px,6vw,32px);line-height:1.15;margin:0 0 9px}.slWelcomeHead p,.slPageTop p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.slWelcomeLogo{width:62px;height:62px;flex:none;border-radius:17px;background:url('./icon-192.png') center/cover;box-shadow:0 8px 22px #0006}
.slSectionTitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 3px 15px}.slSectionTitle h2{font-size:19px;margin:0}.slSectionTitle>span{font-size:11px;color:var(--muted)}
.slTiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-bottom:30px}.slTile{box-sizing:border-box;width:100%;min-height:152px;padding:18px 14px 14px;text-align:left;border-radius:21px;border:1px solid rgba(218,203,162,.24);background:linear-gradient(155deg,rgba(255,255,255,.11),rgba(255,255,255,.035));color:var(--text);display:flex;flex-direction:column;align-items:flex-start;gap:13px;box-shadow:0 8px 22px rgba(0,0,0,.13);cursor:pointer;position:relative}.slTile:active{transform:scale(.98)}.slTileIcon{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:rgba(197,164,109,.16);border:1px solid rgba(197,164,109,.35);color:var(--gold-light);font-size:27px;line-height:1}.slTileCopy{display:flex;flex-direction:column;gap:5px;padding-right:8px}.slTileCopy strong{font-size:15px;line-height:1.25}.slTileCopy small{color:var(--muted);line-height:1.4;font-size:11px}.slTileArrow{position:absolute;bottom:13px;right:14px;color:var(--gold-light);font-size:23px}.slWide{grid-column:span 2;min-height:106px;flex-direction:row;align-items:center;padding:18px}.slWide .slTileIcon{flex:none}.slWide .slTileCopy{padding-right:20px}.slWide .slTileArrow{top:50%;bottom:auto;transform:translateY(-50%)}
.slPageTop{padding:4px 0 19px}.slPageTop h1{margin:15px 0 8px}.slBack{background:transparent;border:0;padding:0 0 18px;color:var(--gold-light);font-size:13px;display:block;text-align:left}.slNotice{padding:15px;border:1px solid var(--border);border-radius:18px;margin-bottom:16px}.slNoticeButtons{display:flex;gap:10px;margin-top:12px}.slNoticeButtons button{flex:1}
@media(max-width:350px){.slTiles{gap:9px}.slTile{padding:14px 10px}.slTileCopy strong{font-size:13px}.slWelcome{padding:22px 16px}.slWelcomeLogo{width:50px;height:50px}}
</style>

// ===================== MON SAC (localStorage) =====================

function loadBag(){
  try{
    return JSON.parse(localStorage.getItem('mag_bag')||'{}');
  }catch(e){
    return {};
  }
}

function saveBag(b){
  try{
    localStorage.setItem('mag_bag',JSON.stringify(b));
  }catch(e){}
}

function getActiveClubs(zone){
  let bag=loadBag();
  let checked=clubOptions[zone].filter(c=>bag[c]&&bag[c].checked);
  return checked;
}

function getClubDistance(club){
  let bag=loadBag();
  return (bag[club]&&bag[club].distance)?bag[club].distance:null;
}

function clubsLabel(zone){
  return (zone==='Approches'?getActiveClubs(zone).slice().reverse():getActiveClubs(zone)).join(' · ');
}

function levelThreshold(n){
  return Math.round(80*Math.pow(n,1.5));
}

function getLevelInfo(totalXp){
  let level=1, remaining=totalXp, thresh=levelThreshold(level);
  while(remaining>=thresh){
    remaining-=thresh;
    level++;
    thresh=levelThreshold(level);
  }
  return {level, xpInLevel:remaining, xpForNext:thresh, totalXp};
}

function computeTotalXp(){
  return loadHistory().reduce((sum,s)=>sum+s.xp,0);
}

function bestStreak(results){
  let max=0,cur=0;
  for(let r of results){
    if(r){cur++;if(cur>max)max=cur;}else cur=0;
  }
  return max;
}

function computeZoneStats(m){
  let sessions=loadHistory().filter(s=>s.zone===m);
  let balls=sessions.reduce((a,s)=>a+s.total,0);
  let ok=sessions.reduce((a,s)=>a+s.ok,0);
  let rate=balls>0?Math.round(ok/balls*100):null;
  let streak=0;
  sessions.forEach(s=>{
    let b=bestStreak(s.results);
    if(b>streak)streak=b;
  });
  return {count:sessions.length,balls,rate,streak,sessions};
}

function computeClubStats(m){
  let opts=clubOptions[m];
  if(!opts)return [];
  return opts.map(c=>{
    let sessions=loadHistory().filter(s=>s.zone===m&&s.club===c);
    let balls=sessions.reduce((a,s)=>a+s.total,0);
    let ok=sessions.reduce((a,s)=>a+s.ok,0);
    let rate=balls>0?Math.round(ok/balls*100):0;
    return {club:c,rate,balls};
  });
}

function computeApproachClubStats(){
  let activeClubs=getActiveClubs('Approches');
  let calibEx=exercises['Approches'].find(e=>e.id==='appCalibrage');
  if(!calibEx)return [];
  return activeClubs.map(c=>{
    let sessions=loadHistory().filter(s=>s.zone==='Approches'&&s.club===c&&s.measure&&Array.isArray(s.distances));
    let groups=SWINGS.map(label=>({label,balls:5,vals:[]}));
    sessions.forEach(s=>{
      let idx=0;
      if(s.swing){groups.find(g=>g.label===s.swing)?.vals.push(...s.distances);} 
    });
    let groupsOut=groups.map(g=>({
      label:g.label,
      avg:g.vals.length?Math.round(g.vals.reduce((a,b)=>a+b,0)/g.vals.length):null
    }));
    return {club:c,groups:groupsOut};
  });
}

// ===================== FLÈCHE DE DISTANCE (SVG) =====================

function dArrow(x1,y1,x2,y2,color){
color=color||'#e3b34a';
let dx=x2-x1,dy=y2-y1;
let len=Math.sqrt(dx*dx+dy*dy)||1;
let ux=dx/len,uy=dy/len;
let ah=6,aw=3.2;
let px=-uy,py=ux;
function head(bx,by,dx2,dy2){
let backx=bx-dx2*ah,backy=by-dy2*ah;
let lx=backx+px*aw,ly=backy+py*aw;
let rx=backx-px*aw,ry=backy-py*aw;
return `<polygon points="${bx},${by} ${lx.toFixed(1)},${ly.toFixed(1)} ${rx.toFixed(1)},${ry.toFixed(1)}" fill="${color}"/>`;
}
return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="1.4"/>${head(x1,y1,-ux,-uy)}${head(x2,y2,ux,uy)}`;
}

let playState={};

function start(m,i){

let ex=exercises[m][i];
let club=selectedClub[ex.id]||ex.clubs[0];

if(ex.kind==='measure'){
let ballLabels=[];
ex.groups.forEach(g=>{for(let k=0;k<g.balls;k++)ballLabels.push(g.label);});
playState={
m,i,kind:'measure',n:1,total:ballLabels.length,ballLabels,
club,distances:[],
startTime:Date.now()
};
renderPlay();
return;
}

let total=ex.kind==='ordered'?ex.groups.reduce((a,g)=>a+g.balls,0):ex.totalBalls;

let subChoice=ex.subChoice?selectedSubChoice[ex.id]:null;

let refDist=null,rangeLow=null,rangeHigh=null;
if(ex.needsRefDistance){
refDist=selectedDistanceVal[ex.id]||140;
rangeLow=refDist-ex.tolerance;
rangeHigh=refDist+ex.tolerance;
}

let playDist=ex.needsDistance?(selectedDistanceVal[ex.id]||ex.distanceDefault):null;

if(ex.kind==='ordered'){
groupLabels=[];

playState={
m,i,kind:ex.kind,n:1,ok:0,no:0,total,results:[],
club,subChoice,refDist,rangeLow,rangeHigh,playDist,groupLabels,

function nextTempo(){
let p=puttingState;
if(p.n>=p.total){
finishPutting();
return;
}
p.n++;
renderPlayPutting();
}

function hitPutting(ok){

let p=puttingState;

p.results.push(ok);

if(ok)p.ok++;else p.no++;

if(p.type==='simple'){
if(p.n>=p.total){
finishPutting();
return;
}
p.n++;
renderPlayPutting();
return;
}

// sequence
if(ok){
p.idx++;
if(p.idx>=p.distances.length){
p.validated=true;
finishPutting();
return;
}
}else{
p.idx=0;
p.round++;
if(p.round>p.maxRounds){
finishPutting();
return;
}
}

renderPlayPutting();
}

let p=puttingState;
let e=puttingById(p.id);

let total=p.type==='tempo'?p.total:p.results.length;
let rate=p.type==='tempo'?100:(total>0?Math.round(p.ok/total*100):0);

if(p.type==='simple')validated=(p.ok>=p.target);

let mult=MULT[e.niveau]||1;
let xpPerBall=Math.round(XP_PER_BALL*mult);

let xp=(p.type==='tempo')?Math.round(p.total*xpPerBall):(p.ok*xpPerBall+bonus);
let duration=Math.round((Date.now()-p.startTime)/1000);

saveSession({

zone:'Putting',
exercise:e.nom,
niveau:e.niveau,

ok:p.type==='tempo'?p.total:p.ok,
no:p.type==='tempo'?0:p.no,

duration,

function bagScreen(){

let entry=bag[c]||{checked:false,distance:''};
return `

}

function onBagCheck(club,checked){
let bag=loadBag();
if(!bag[club])bag[club]={checked:false,distance:''};
bag[club].checked=checked;
saveBag(bag);
}

function onBagDist(club,val){
let bag=loadBag();
if(!bag[club])bag[club]={checked:false,distance:''};
bag[club].distance=val?parseFloat(val):'';
saveBag(bag);
}

// ===================== THÈME CLAIR / SOMBRE =====================

function loadTheme(){
  try{
    return localStorage.getItem('mag_theme')||'dark';
  }catch(e){
    return 'dark';
  }
}

function saveTheme(t){
  try{
    localStorage.setItem('mag_theme',t);
  }catch(e){}
}

function applyTheme(){
  if(loadTheme()==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
}

function toggleTheme(){
  saveTheme(loadTheme()==='light'?'dark':'light');
  applyTheme();
  profile();
}

const SHARE_URL='https://steven210793.github.io/SwiingLab/';
const SHARE_TEXT='Découvre SwiingLab, mon appli d\'entraînement au golf !';

function shareApp(){
  if(navigator.share){
    navigator.share({title:'SwiingLab',text:SHARE_TEXT,url:SHARE_URL}).catch(()=>{});
  }else{
    copyShareLink();
  }
}

function copyShareLink(){
  let note=document.getElementById('shareNote');
  function done(msg){
    if(note){
      note.textContent=msg;
      setTimeout(()=>{if(note)note.textContent='';},2000);
    }
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(SHARE_URL).then(()=>done('Lien copié ✓')).catch(()=>done(SHARE_URL));
  }else{
    done(SHARE_URL);
  }
}

}

// Configuration des exercices et distances centralisées dans le sac.
const SWINGS=['Full swing','Trois-quarts','Demi-swing'];
const SWING_KEYS={'Full swing':'full','Trois-quarts':'threeQuarter','Demi-swing':'half'};
const removed=new Set(['appContact','appTrajectoire','ferDistance','ljDistance']);
for(const zone of Object.keys(exercises)) exercises[zone]=exercises[zone].filter(e=>!removed.has(e.id));
puttingExercises.splice(puttingExercises.findIndex(e=>e.id==='tempo'),1);
for(const zone of Object.keys(exercises)) for(const ex of exercises[zone]) {
 if(ex.id==='appCalibrage') {
  ex.subChoice={label:'Type de swing',options:SWINGS};
  ex.description='Choisis un wedge de ton sac, puis full swing, trois-quarts ou demi-swing. Joue 5 balles avec cette amplitude.';
  ex.objectif='Indique la distance obtenue après chaque coup. La distance de référence se modifie uniquement dans Mon sac.';
  ex.groups=[{label:'Swing choisi',balls:5}];
 } else {
  ex.radiusPercent=zone==='Long jeu'||ex.kind==='ordered'?15:10;
  ex.needsDistance=false;ex.needsRefDistance=false;
  if(ex.id==='appPrecision')ex.subChoice={label:'Type de swing',options:SWINGS};
  if(ex.id.endsWith('Direction')){ex.nom='Précision';ex.tag='Précision';}
  ex.description=ex.kind==='ordered'?'Choisis un club de ton sac. Vise une cible à sa distance de référence et joue 3 balles droites, 3 fades puis 3 draws.': 'Choisis un club de ton sac et une cible à la distance de référence affichée. La zone de réussite est un cercle autour de la cible.';
  ex.description+=` Le rayon de tolérance vaut ${ex.radiusPercent} % de la distance.`;
  ex.objectif=ex.kind==='ordered'?'Réussis au moins 2 balles sur 3 dans chaque trajectoire demandée, avec la balle terminant dans la zone de tolérance.':'Réussis 7 balles sur 10 dans le cercle de tolérance autour de la cible.';
 }
}

 const value=clubOptions.Approches.includes(club)?(entry.distances?.[SWING_KEYS[swing||SWINGS[0]]]??(swing===SWINGS[0]||!swing?entry.distance:null)):entry.distance;
 return Number(value)>0?Number(value):null;
}

function targetDiagram(distance,percent,effect=false,approach=false){
 const key=approach?'approche':effect?'effet':'precision';
 const view=approach?'0 0 480 270':'0 0 480 320';
 const label=distance?`${fmt(distance)} m · rayon ${fmt(distance*percent/100)} m`:`Rayon de tolérance : ${percent} %`;
 const radius=23*percent/10;
 const overlay=approach?'':effect?`<path d="M240 284 C190 205 175 80 240 20" stroke="#ef3b26" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/><path d="M240 284 C290 205 305 80 240 20" stroke="#20ea54" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/><path d="M229 23 L240 20 L235 32" stroke="#ef3b26" stroke-width="2.5" fill="none"/><path d="M245 32 L240 20 L251 23" stroke="#20ea54" stroke-width="2.5" fill="none"/><circle cx="240" cy="40" r="${radius}" stroke="white" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>`:`<circle cx="240" cy="118" r="${radius}" stroke="white" stroke-width="1.8" stroke-dasharray="5 5" fill="none"/><circle cx="240" cy="118" r="4" fill="white"/>`;
 return `<div style="width:100%"><svg viewBox="${view}" role="img" aria-label="${effect?'Trajectoires droite, fade et draw':'Cible et rayon de tolérance'}" style="display:block;width:100%;border-radius:8px"><image href="data:image/jpeg;base64,${originalVisualBackgrounds[key]}" width="480" height="${approach?270:320}"/>${overlay}${approach?`<text x="275" y="60" font-size="12" fill="white">${distance?fmt(distance*percent/100)+' m':percent+' %'}</text>`:''}</svg><div style="text-align:center;font-size:12px;padding:6px 0">${label}</div></div>`;
}
const originalThumb=exThumb;
exThumb=function(ex){return ex.radiusPercent?targetDiagram(null,ex.radiusPercent,ex.kind==='ordered',ex.id==='appPrecision'):originalThumb(ex);};
function detail(m,i){
 currentDetailM=m;currentDetailI=i;
 const ex=exercises[m][i],clubs=getActiveClubs(m);
 if(!clubs.includes(selectedClub[ex.id]))selectedClub[ex.id]=clubs[0];
 if(ex.subChoice&&!ex.subChoice.options.includes(selectedSubChoice[ex.id]))selectedSubChoice[ex.id]=ex.subChoice.options[0];
 const club=selectedClub[ex.id],swing=selectedSubChoice[ex.id],distance=getClubDistance(club,swing);
 const total=ex.kind==='measure'?5:ex.kind==='ordered'?9:10;
 S.innerHTML=`<div class="back" onclick="list('${m}')">← Exercices</div><span class="tag">${ex.tag}</span><h1>${ex.nom}</h1>
 <div class="diagram">${ex.radiusPercent?targetDiagram(distance,ex.radiusPercent,ex.kind==='ordered',ex.id==='appPrecision'):exThumb(ex)}</div>
 <div class="field"><label>Club</label><select class="clubSelect" onchange="pickClub('${ex.id}',this.value)">${clubs.map(c=>`<option ${c===club?'selected':''}>${c}</option>`).join('')}</select></div>
 ${ex.subChoice?`<div class="field"><label>Type de swing</label><select class="clubSelect" onchange="pickSubChoice('${ex.id}',this.value)">${SWINGS.map(v=>`<option ${v===swing?'selected':''}>${v}</option>`).join('')}</select></div>`:''}
 <div class="metrics"><div class="metric"><b>${distance?fmt(distance)+' m':'—'}</b>Distance de référence</div>${ex.radiusPercent?`<div class="metric"><b>${distance?fmt(distance*ex.radiusPercent/100)+' m':'—'}</b>Rayon de tolérance · ${ex.radiusPercent} %</div>`:''}</div>
 ${!club||!distance?`<div class="info">${!club?'Sélectionne tes clubs':'Renseigne la distance de ce club et de ce swing'} dans <button onclick="bagScreen()">Mon sac</button>.</div>`:''}
 <div class="metrics"><div class="metric"><b>${total}</b>Balles</div></div><div class="info"><h3>DESCRIPTION</h3><p>${ex.description}</p></div><div class="info"><h3>OBJECTIF</h3><p>${ex.objectif}</p></div>
 <button class="primary" ${!club||(!distance&&ex.kind!=='measure')?'disabled':''} onclick="start('${m}',${i})">Commencer l’exercice</button>`;
 setActiveTab('exercices');
}
function pickClub(id,val){selectedClub[id]=val;detail(currentDetailM,currentDetailI);}
const originalStart=start;
start=function(m,i){
 const ex=exercises[m][i],club=selectedClub[ex.id],swing=selectedSubChoice[ex.id];
 if(!getActiveClubs(m).includes(club)||(!getClubDistance(club,swing)&&ex.kind!=='measure'))return;
 if(ex.kind==='measure')ex.groups=[{label:swing,balls:5}];
 originalStart(m,i);playState.swing=swing;
};
function bagScreen(){
 const bag=loadBag();
 S.innerHTML=`<div class="back" onclick="profile()">← Profil</div><h1>Mon sac</h1><div class="muted">Coche tes clubs et renseigne tes distances en mètres. Chaque wedge a trois distances indépendantes.</div>
 ${zonesOrder.map(zone=>`<div class="section"><h2>${zone}</h2>${clubOptions[zone].map(c=>{

 }).join('')}</div>`).join('')}<div id="bagSaveNote" class="saveNote"></div><button class="primary" onclick="profile()">Valider</button>`;
 setActiveTab('profil');
}
function onWedgeDist(club,key,value){

}

 if(localStorage.getItem('swiinglab_reset_20261010')!=='done'){

 if(lastSavedId){const h=loadHistory();const index=h.findIndex(s=>s.id===lastSavedId);if(index<0)return;h.splice(index,1);if(!putLocal('mag_history',h))return;lastSavedId=null;}
 const previous=undoStates.pop();activeTraining=previous.id?'putting':'practice';

const MISS_LABELS={'long-left':'Long à gauche',long:'Long','long-right':'Long à droite',left:'Gauche',right:'Droite','short-left':'Court à gauche',short:'Court','short-right':'Court à droite'};
stats=function(m){

function suggestTraining(){
 const candidates=[];
 for(const zone of ['Approches','Fers','Long jeu'])for(const ex of exercises[zone].filter(e=>!e.kind.includes('measure'))){
  const valid=practiceSessions(zone).filter(s=>s.exerciseId===ex.id&&(!s.difficulty||s.difficulty==='standard'));
  const groups=new Map();valid.forEach(s=>{const key=[s.club,s.swing||'',s.distanceBasis||'Carry'].join('|');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s);});
  for(const rows of groups.values()){const recent=rows.slice(-5),balls=recent.reduce((a,s)=>a+s.total,0);if(recent.length<3||balls<20)continue;const last=recent[recent.length-1];if(!getActiveClubs(zone).includes(last.club)||!getClubDistance(last.club,last.swing)||distanceBasis(last.club)!==(last.distanceBasis||'Carry'))continue;candidates.push({zone,ex,club:last.club,swing:last.swing,rate:recent.reduce((a,s)=>a+s.ok,0)/balls,balls});}
 }
 const put=practiceSessions('Putting');for(const ex of puttingExercises){const rows=put.filter(s=>s.exerciseId===ex.id).slice(-5);if(rows.length>=3)candidates.push({zone:'Putting',ex,rate:rows.reduce((a,s)=>a+s.ok,0)/rows.reduce((a,s)=>a+s.total,0),balls:rows.reduce((a,s)=>a+s.total,0)});}
 candidates.sort((a,b)=>a.rate-b.rate);const c=candidates[0];if(!c)return '';
 return `<div class="section info"><h3>À TRAVAILLER</h3><p>${c.zone} · ${c.ex.nom}${c.club?' · '+c.club:''}${c.swing?' · '+c.swing:''}</p><p>${Math.round(c.rate*100)} % sur ${c.balls} balles récentes, en difficulté standard.</p><button class="primary" onclick="openSuggestion('${c.zone}','${c.ex.id}','${c.club||''}','${c.swing||''}')">Voir l’exercice</button></div>`;
}
function openSuggestion(zone,id,club,swing){if(zone==='Putting'){detailPutting(id);return;}selectedClub[id]=club;if(swing)selectedSubChoice[id]=swing;selectedDifficulty[id]='standard';detail(zone,exercises[zone].findIndex(e=>e.id===id));}

function tmDownload(name,obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function tmBackup(){const keys={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('mag_')||k.startsWith('swiinglab_'))keys[k]=localStorage.getItem(k)}(async()=>{const data={format:'swiinglab-backup-v1',keys},file=new File([JSON.stringify(data,null,2)],'SwiingLab-sauvegarde.json',{type:'application/json'});try{if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Sauvegarde SwiingLab'});return}}catch(e){if(e.name==='AbortError')return}tmDownload(file.name,data)})()}
function tmRestore(input){const f=input.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o.format!=='swiinglab-backup-v1'||!o.keys||Object.entries(o.keys).some(([k,v])=>!(k.startsWith('mag_')||k.startsWith('swiinglab_'))||typeof v!=='string'))throw Error('Sauvegarde incorrecte');if(confirm('Restaurer cette sauvegarde et remplacer les données correspondantes ?')){Object.entries(o.keys).forEach(([k,v])=>localStorage.setItem(k,v));progressHub()}}catch(e){alert(e.message)}input.value=''})}

function tmAmplitudeOf(b){const v=String(b.amplitude||b.swing||b.swingType||'').toLowerCase().trim();if(['full','full swing','complet'].includes(v))return 'full';if(['3/4','¾','trois quarts'].includes(v))return 'threequarter';if(['1/2','½','demi','half'].includes(v))return 'half';return 'unknown'}

('fr-FR')} · ${esc(s.venue||'TrackMan Range')} · ${s.shots.length} balles</span><b>${tmShow(tmMean(s.shots,'carry'))} m</b></div>`).join('')||'<p class="muted">Aucune séance.</p>'}</div><p class="muted">Les pourcentages d’exercices restent séparés : sans critère de réussite explicite, une balle TrackMan ne peut pas être notée automatiquement.</p>`;setActiveTab('progression')}
progressHub=function(){const clubs=tmClubs();S.innerHTML=`<h1>Progression</h1><p class="muted">Mesures TrackMan, statistiques d’entraînement et progression par club. Les dates issues des captures restent à confirmer.</p><div class="section"><h2>Mes clubs</h2>${clubs.map((c,i)=>{const shots=tmSessions(c).flatMap(s=>s.shots);return `<div class="card" style="margin-bottom:10px" onclick="tmClub(tmClubs()[${i}])"><b>${esc(c)}</b><span class="muted">Carry ${tmShow(tmMean(shots,'carry'))} m · Total ${tmShow(tmMean(shots,'total'))} m</span></div>`}).join('')||'<p class="muted">Ajoute des clubs dans Mon sac ou importe une séance.</p>'}</div><div class="section"><h2>Statistiques des exercices</h2>${zonesOrder.map(m=>`<div class="card" style="margin-bottom:10px" onclick="stats('${m}')"><b>${m}</b><span class="muted">Réussite et historique des exercices</span></div>`).join('')}</div>`;setActiveTab('progression')};

// Match TrackMan's English club names with the original French Mon sac labels.
function tmCanonClub(c){
 const x=String(c||'').trim();
 const dict={'5 Iron':'Fer 5','6 Iron':'Fer 6','7 Iron':'Fer 7','8 Iron':'Fer 8','9 Iron':'Fer 9','4 Iron':'Fer 4','3 Iron':'Fer 3','2 Iron':'Fer 2','3 Wood':'Bois 3','5 Wood':'Bois 5','7 Wood':'Bois 7','3 Hybrid':'Hybride 3','5 Hybrid':'Hybride 5','7 Hybrid':'Hybride 7','50 Wedge':'50°','52 Wedge':'52°','54 Wedge':'54°','56 Wedge':'56°','58 Wedge':'58°','60 Wedge':'60°','Pitching Wedge':'PW'};
 return dict[x]||dict[Object.keys(dict).find(k=>k.toLowerCase()===x.toLowerCase())]||({'Pitch':'PW','Pitching':'PW','Fer 5':'Fer 5','Fer 6':'Fer 6'}[x])||x;
}
function tmShotSignature(sh){
 const m=sh.metrics||sh;
 return [tmCanonClub(sh.club),'carry','total','ballSpeed','launchAngle'].map((x,i)=>i?String(m[x]??''):x).join('|');
}
function tmSessionFingerprint(shots){return shots.map(tmShotSignature).sort().join('~');}
function tmFnv(str){let h=2166136261;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);return (h>>>0).toString(16)}
function tmSeedV12(){
 try{
  const all=tmData(), source=tmEmbeddedV12[0];
  const exact=tmSessionFingerprint(source.shots);
  // Skip if this same batch was already imported manually in the V11.
  const exists=all.some(s=>tmSessionFingerprint(s.shots)===exact)
   ||source.shots.every(sh=>all.some(s=>s.shots.some(existing=>tmShotSignature(existing)===tmShotSignature(sh))));
  if(exists)return;
  localStorage.setItem(tmKey,JSON.stringify([...all,source]));

function tmImport(input){
 const f=input.files&&input.files[0];if(!f)return;
 if(f.size>3000000){alert('Fichier trop volumineux (3 Mo maximum).');input.value='';return}
 f.text().then(content=>{
  try{
   const o=JSON.parse(content);
   if(!o||typeof o!=='object'||Array.isArray(o))throw Error('Format JSON incorrect.');
   if(o.format==='swiinglab-backup-v1')throw Error('Pour ce fichier, utilise « Restaurer une sauvegarde » dans Profil.');
   const entries=Array.isArray(o.sessions)?o.sessions:[o];
   if(!entries.length||entries.length>150)throw Error('Aucune séance ou trop de séances dans ce fichier.');
   const all=tmData();
   if(!Array.isArray(all))throw Error('Données enregistrées invalides.');
   const seen=new Set(all.filter(s=>Array.isArray(s.shots)).map(s=>tmSessionFingerprint(s.shots)));
   const knownSources=new Set(all.flatMap(s=>(s.shots||[]).map(sh=>sh.sourceId).filter(Boolean)));
   const pending=[];
   let added=0, duplicates=0, addedShots=0;
   for(const raw of entries){
    if(!raw||!Array.isArray(raw.shots)||!raw.shots.length||raw.shots.length>3000)throw Error('Liste des coups incorrecte.');
    const dt=raw.date||new Date().toISOString();
    if(typeof dt!=='string'||!Number.isFinite(Date.parse(dt)))throw Error('Date incorrecte.');
    const parsed=raw.shots.map(sh=>{
     if(!sh||typeof sh.club!=='string'||!sh.club.trim())throw Error('Un coup n’a pas de club.');
     const metrics={};
     for(const k of Object.keys(tmFields)){
      const val=sh.metrics?.[k]??sh[k];
      if(val!==null&&val!==undefined&&val!==''&&Number.isFinite(Number(val)))metrics[k]=Number(val);
     }
     if(!Object.keys(metrics).length)throw Error('Un coup n’a aucune mesure reconnue.');
     return {club:tmCanonClub(sh.club.trim()),metrics,amplitude:sh.amplitude||sh.swing||sh.swingType||null,amplitudeUnverified:!!sh.amplitudeUnverified,shotNumber:sh.shotNumber??null,sourceId:sh.sourceId||null};
    });
    const fp=tmSessionFingerprint(parsed);
    if(seen.has(fp)||parsed.every(sh=>sh.sourceId&&knownSources.has(sh.sourceId))){duplicates++;continue}
    const date=new Date(dt).toISOString(),id='tm-v12-'+tmFnv(fp+'|'+date);
    const venue=String(raw.venue||'TrackMan Range').slice(0,180);
    const dateUnverified=!!raw.dateUnverified||!raw.date||!!o.metadata?.actualSessionDateKnown===false&&!!o.metadata?.dateNote;
    pending.push({id,date,venue,shots:parsed,dateUnverified,source:raw.source||null});
    seen.add(fp);parsed.forEach(sh=>{if(sh.sourceId)knownSources.add(sh.sourceId)});added++;addedShots+=parsed.length;
   }
   if(pending.length)localStorage.setItem(tmKey,JSON.stringify([...all,...pending]));
   alert(added+' séance(s) ajoutée(s) · '+addedShots+' coups. '+duplicates+' doublon(s) ignoré(s).');
   progressHub();
  }catch(e){alert('Import impossible : '+e.message)}finally{input.value=''}
 }).catch(e=>{alert('Lecture du fichier impossible : '+e.message);input.value=''})
}

 const series=[['full','Plein swing','#e3b34a'],['threequarter','3/4 de swing','#8ebca4'],['half','Demi-swing','#7fa3c9']];

 const allValues=groups.flatMap(g=>g.points.map(p=>p.value));
 if(!allValues.length)return '<p class="muted">Aucune séance datée et confirmée avec une amplitude renseignée. Les coups sont conservés dans les statistiques et l’historique.</p>';
 const dates=[...new Set(groups.flatMap(g=>g.points.map(p=>p.date)))].sort(),lo=Math.min(...allValues)-Math.max(1,(Math.max(...allValues)-Math.min(...allValues))*.15),hi=Math.max(...allValues)+Math.max(1,(Math.max(...allValues)-Math.min(...allValues))*.15);
 const xp=d=>dates.length===1?180:48+280*dates.indexOf(d)/(dates.length-1),yp=v=>151-130*(v-lo)/(hi-lo);
 return `<svg viewBox="0 0 360 202" style="width:100%" role="img" aria-label="Trois courbes de distance par amplitude : plein, trois quarts et demi-swing">${[0,.5,1].map(t=>`<line x1="45" y1="${21+t*130}" x2="335" y2="${21+t*130}" stroke="currentColor" opacity=".14"/><text x="39" y="${25+t*130}" font-size="10" text-anchor="end" fill="currentColor">${tmShow(hi-t*(hi-lo))}</text>`).join('')}${groups.map(g=>`<polyline points="${g.points.map(p=>xp(p.date)+','+yp(p.value)).join(' ')}" fill="none" stroke="${g.color}" stroke-width="2.5"/>${g.points.map(p=>`<circle cx="${xp(p.date)}" cy="${yp(p.value)}" r="4" fill="${g.color}"><title>${g.label} · ${new Date(p.date).toLocaleDateString('fr-FR')} : ${tmShow(p.value)}</title></circle>`).join('')}`).join('')}${dates.filter((d,i)=>dates.length<=4||i===0||i===dates.length-1).map(d=>`<text x="${xp(d)}" y="177" text-anchor="middle" font-size="10" fill="currentColor">${new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</text>`).join('')}</svg><div style="display:flex;flex-wrap:wrap;gap:10px">${groups.map(g=>`<span style="font-size:12px"><span style="color:${g.color}">●</span> ${g.label} (${g.points.length})</span>`).join('')}</div><p class="muted">Trois courbes indépendantes, sans mélange des amplitudes. Dates non confirmées et coups sans amplitude exclus des courbes.</p>`;
};

 const rounds=slVirtualData();
 const tiles=rounds.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>{

 }).join('');

 '<div class="info"><h3>Importer une partie</h3><p class="muted">Envoie tes captures TrackMan dans notre conversation. Je te fournirai un fichier JSON à importer ici.</p><input type="file" id="slVirtualFile" accept=".json,application/json" onchange="slVirtualImport(this)"><button class="secondary" onclick="slVirtualExample()">Télécharger un modèle JSON</button><button class="secondary" onclick="slVirtualExport()">Exporter mes parties</button></div>'+
 '<div class="slSectionTitle"><h2>Mes parties</h2><span>'+rounds.length+' enregistrée(s)</span></div><div class="slTiles">'+(tiles||'<p class="muted">Aucune partie importée pour le moment.</p>')+'</div>');

function slVirtualNormalize(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Une partie est invalide.');
 const course=String(raw.course||raw.courseName||'').trim();
 const date=String(raw.date||'').slice(0,10);
 if(!course||course.length>200)throw Error('Nom de parcours manquant ou trop long.');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(date+'T12:00:00Z')))throw Error('Date de partie incorrecte.');
 const inputHoles=raw.holes||[];
 if(!Array.isArray(inputHoles)||inputHoles.length>18)throw Error('Liste des trous invalide.');
 const holes=inputHoles.map((h,i)=>{
  const number=slVirtualNumber(h.number??i+1),par=slVirtualNumber(h.par),score=slVirtualNumber(h.score??h.shots),handicap=slVirtualNumber(h.handicap??h.hcp);
  if(!Number.isInteger(number)||number<1||number>18||!Number.isInteger(par)||par<3||par>6||!Number.isInteger(score)||score<1||score>30)throw Error('Trou '+(i+1)+' : numéro, par ou coups invalides.');
  return {number,par,score,handicap:Number.isInteger(handicap)?handicap:null,distance:slVirtualNumber(h.distance),shots:Array.isArray(h.shotsDetail)?h.shotsDetail.slice(0,30):[]};
 });
 if(new Set(holes.map(h=>h.number)).size!==holes.length)throw Error('Numéros de trous répétés.');
 const holeCount=slVirtualNumber(raw.holeCount)??holes.length;
 if(![9,18].includes(holeCount))throw Error('Format : 9 ou 18 trous attendu.');
 if(holes.length&&holes.length!==holeCount)throw Error('Il manque des trous sur la carte de score.');
 const score=holes.length?holes.reduce((sum,h)=>sum+h.score,0):slVirtualNumber(raw.totalScore);
 const par=holes.length?holes.reduce((sum,h)=>sum+h.par,0):slVirtualNumber(raw.totalPar);
 if(score===null||!Number.isInteger(score)||score<1||score>540)throw Error('Score total absent ou invalide.');
 const stats=raw.stats&&typeof raw.stats==='object'&&!Array.isArray(raw.stats)?raw.stats:{};
 const sanitized={};
 for(const k of ['fairwaysHitPct','girPct','scramblingPct','averageDriveM','longestDriveM']){
  const v=slVirtualNumber(stats[k]);if(v!==null){if(k.endsWith('Pct')&&(v<0||v>100))throw Error('Pourcentage hors limites : '+k);if(!k.endsWith('Pct')&&(v<0||v>600))throw Error('Distance hors limites : '+k);sanitized[k]=v}
 }
 const settings=raw.settings&&typeof raw.settings==='object'&&!Array.isArray(raw.settings)?raw.settings:{};
 const keep={};for(const k of ['gameType','format','flags','mulligans','putting','gimmeDistanceM','wind','fairwayFirmness','greenFirmness','greenSpeed']){if(settings[k]!==undefined&&settings[k]!==null)keep[k]=String(settings[k]).slice(0,120)}
 return {course,date,holeCount,holes,totalScore:score,totalPar:par,stats:sanitized,settings:keep,player:String(raw.player||'').slice(0,100),source:'trackman-virtual',notes:String(raw.notes||'').slice(0,500)};
}
function slVirtualImport(input){
 const file=input.files&&input.files[0];if(!file)return;
 if(file.size>2000000){alert('Fichier trop volumineux.');input.value='';return}
 file.text().then(content=>{
  try{
   const payload=JSON.parse(content);
   if(!payload||payload.format!=='swiinglab-trackman-courses-v1'||!Array.isArray(payload.rounds))throw Error('Format de fichier incompatible avec les parcours TrackMan.');
   if(!payload.rounds.length||payload.rounds.length>100)throw Error('Le fichier doit contenir entre 1 et 100 parties.');
   const prior=slVirtualData(),seen=new Set(prior.map(slVirtualFingerprint)),pending=[];
   let duplicates=0;
   for(const raw of payload.rounds){const round=slVirtualNormalize(raw),fp=slVirtualFingerprint(round);if(seen.has(fp)){duplicates++;continue}seen.add(fp);pending.push(round)}
   if(pending.length)localStorage.setItem(slVirtualKey,JSON.stringify([...prior,...pending]));
   alert(pending.length+' partie(s) importée(s). '+duplicates+' doublon(s) ignoré(s).');
   slVirtualHome();
  }catch(e){alert('Importation impossible : '+e.message)}
  finally{input.value=''}
 }).catch(e=>{alert('Lecture impossible : '+e.message);input.value=''});
}

function realParseRound(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Partie invalide');
 const golf=String(raw.golf||'').trim(),name=String(raw.name||raw.course||'').trim(),date=String(raw.date||'').trim();
 if(!golf||!name||golf.length>180||name.length>180)throw Error('Nom du golf et du parcours obligatoires');
 if(date&&(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(date+'T12:00:00Z'))))throw Error('Date incorrecte');
 if(!Array.isArray(raw.holes)||![9,18].includes(raw.holes.length))throw Error('Une carte de 9 ou 18 trous complète est nécessaire');
 const holes=raw.holes.map((h,i)=>{
  const par=Number(h.par),shots=Number(h.shots??h.score),hcp=h.hcp??h.handicap;
  if(![3,4,5].includes(par)||!Number.isInteger(shots)||shots<1||shots>30)throw Error('Trou '+(i+1)+' : par ou score brut incorrect');
  const handicap=hcp===null||hcp===undefined||hcp===''?null:Number(hcp);
  if(handicap!==null&&(!Number.isInteger(handicap)||handicap<1||handicap>18))throw Error('Trou '+(i+1)+' : HCP incorrect');
  return {par,shots,putts:null,hcp:handicap};
 });
 return {id:Date.now()+'-'+Math.random().toString(36).slice(2,8),golf,name,date,count:holes.length,holes,source:'ffgolf-screenshots'};
}
function realRoundFingerprint(r){return [r.golf.toLowerCase().trim(),r.name.toLowerCase().trim(),r.date||'',r.holes.map(h=>h.par+':'+h.shots).join('|')].join('~')}
/* Quatre cartes FFGolf embarquées : une seule insertion par empreinte, sans écraser les autres données. */
const slPreloadedRealRounds=[["Golf de Saint-Malo","Surcouf","2026-08-18",[5,4,4,3,4,3,5,4,4,4,3,4,4,3,5,4,4,5],[5,4,4,3,5,4,5,5,4,4,2,4,5,4,3,5,5,3],[9,17,12,15,1,13,14,10,4,5,16,3,6,11,18,2,8,7]],["Dinard Golf","Dinard","2026-08-19",[4,4,4,5,4,4,3,4,3,4,4,3,3,4,4,4,3,4],[5,4,4,7,5,4,4,5,4,4,4,4,3,4,5,5,4,4],[9,1,5,15,3,11,17,13,7,6,8,4,10,12,16,2,18,14]],["Les Ormes Golf & Resort","Le Château","2026-08-20",[5,3,5,4,4,4,5,3,4,4,3,4,4,5,3,5,3,4],[5,4,4,4,4,4,5,4,4,4,3,5,4,4,4,5,4,5],[7,13,9,1,15,3,5,17,11,2,18,10,4,14,12,8,16,6]],["Golf du Gouverneur","Le Breuil","2026-09-13",[4,3,5,3,4,4,4,5,4,4,3,4,4,4,5,3,5,4],[5,4,4,3,6,7,4,6,5,6,4,5,5,5,8,5,7,7],[8,12,18,10,2,6,14,16,4,11,17,3,13,1,9,7,15,5]]];
function slSeedRealRounds(){
 try{
  const db=realGet();if(!db||!Array.isArray(db.rounds)||!Array.isArray(db.courses))return;
  const seen=new Set(db.rounds.map(realRoundFingerprint));
  let changed=false;
  for(const [golf,name,date,pars,scores,hcps] of slPreloadedRealRounds){
   const raw={golf,name,date,holes:pars.map((par,i)=>({par,shots:scores[i],hcp:hcps[i]}))};
   const round=realParseRound(raw),fp=realRoundFingerprint(round);
   if(seen.has(fp))continue;
   db.rounds.push(round);seen.add(fp);changed=true;
   if(!db.courses.some(c=>c.golf===golf&&c.name===name&&c.count===round.count))db.courses.push({golf,name,count:round.count,pars:pars.slice()});
  }
  if(changed)realSave(db);
 }catch(e){console.warn('Cartes FFGolf préchargées non ajoutées :',e)}
}

function realImportJSON(input){
 const f=input.files?.[0];if(!f)return;
 if(f.size>2000000){alert('Fichier trop volumineux');input.value='';return}
 f.text().then(t=>{try{
  const payload=JSON.parse(t);
  if(payload?.format!=='swiinglab-real-rounds-v1'||!Array.isArray(payload.rounds)||!payload.rounds.length||payload.rounds.length>100)throw Error('Format incompatible : fichier Parcours réels SwiingLab attendu');
  const d=realGet(),rounds=payload.rounds.map(realParseRound),seen=new Set(d.rounds.map(realRoundFingerprint)),pending=[];
  for(const round of rounds){const fp=realRoundFingerprint(round);if(!seen.has(fp)){pending.push(round);seen.add(fp)}}
  if(pending.length){d.rounds.push(...pending);for(const r of pending){if(!d.courses.some(c=>c.golf===r.golf&&c.name===r.name&&c.count===r.count))d.courses.push({golf:r.golf,name:r.name,count:r.count,pars:r.holes.map(h=>h.par)})}realSave(d)}
  alert(pending.length+' partie(s) importée(s) ; '+(rounds.length-pending.length)+' doublon(s) ignoré(s).');realStats();
 }catch(e){alert('Import impossible : '+e.message)}finally{input.value=''}}).catch(e=>{alert('Lecture impossible : '+e.message);input.value=''});
}

function realAutofill(){

 if(chosen==='')return;

function realStart(){

 let c=realGet().courses.find(c=>c.golf===golf&&c.name===name&&c.count===count);
 realDraft={id:Date.now(),date:document.getElementById('rd').value,golf,name,count,holes:Array.from({length:count},(_,i)=>({par:c?.pars[i]||4,shots:null,putts:null}))};realAt=0;realPersistDraft();realHole();

function realHole(){
 let h=realDraft.holes[realAt];
 realUI('<h1>Trou '+(realAt+1)+' / '+realDraft.count+'</h1><p>'+safe(realDraft.golf)+' — '+safe(realDraft.name)+'</p><div class="info"><div class="field"><label>Par</label><select id="hp">'+[3,4,5,6].map(n=>'<option '+(n===h.par?'selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="field"><label>Coups joués</label><input id="hs" type="number" min="1" max="30" value="'+(h.shots??'')+'"></div><div class="field"><label>Putts (facultatif)</label><input id="hu" type="number" min="0" max="15" value="'+(h.putts??'')+'"></div><button onclick="realNext()">'+(realAt===realDraft.count-1?'Enregistrer la partie':'Valider ce trou')+'</button> '+(realAt?'<button class="secondary" onclick="realBack()">Précédent</button>':'')+'</div>');

function realRecord(){let shotInput=document.getElementById('hs');if(!shotInput.value.trim()) {alert('Le nombre de coups est obligatoire.');return false}let a=Number(shotInput.value);if(!Number.isInteger(a)||a<1||a>30){alert('Entre le nombre de coups.');return false}let puttInput=document.getElementById('hu');let p=puttInput.value===''?null:Number(puttInput.value);if(p!==null&&(!Number.isInteger(p)||p<0||p>15||p>a)){alert('Le nombre de putts doit être compris entre 0 et le nombre de coups joués.');return false}realDraft.holes[realAt]={par:+document.getElementById('hp').value,shots:a,putts:p};realPersistDraft();return true}
function realBack(){if(realRecord()){realAt--;realPersistDraft();realHole()}}
function realNext(){if(!realRecord())return;if(++realAt<realDraft.count){realPersistDraft();realHole();return}let d=realGet(),r=realDraft;d.rounds.push(r);if(!d.courses.some(c=>c.golf===r.golf&&c.name===r.name&&c.count===r.count))d.courses.push({golf:r.golf,name:r.name,count:r.count,pars:r.holes.map(h=>h.par)});realSave(d);localStorage.removeItem(realDraftKey);realDraft=null;realStats()}
function realStats(){
 let d=realGet(),a=d.rounds.flatMap(r=>r.holes);
 let stats=[3,4,5].map(par=>{let h=a.filter(x=>x.par===par),n=h.length,pc=k=>n?Math.round(100*h.filter(x=>x.shots-x.par===k).length/n)+'%':'—',mean=n?(h.reduce((t,x)=>t+x.shots,0)/n).toFixed(2):'—';return '<div class="stat"><b>Par '+par+'</b><p>'+n+' trous · Moyenne '+mean+' coups · Birdies '+pc(-1)+' · Pars '+pc(0)+' · Bogeys '+pc(1)+' · Doubles '+pc(2)+'</p></div>'}).join('');
 let rows=d.rounds.slice().reverse().map(r=>{let score=r.holes.reduce((v,h)=>v+h.shots,0),par=r.holes.reduce((v,h)=>v+h.par,0);return '<div class="histItem"><div><b>'+safe(r.golf)+' — '+safe(r.name)+'</b><small>'+safe(r.date)+' • '+r.count+' trous</small></div><div class="r"><b>'+score+'</b>'+(score-par>=0?'+':'')+(score-par)+'</div></div>'}).join('');
 realUI('<h1>Parcours réels</h1><button onclick="realImportPage()">+ Nouvelle partie</button><button class="secondary" onclick="realHome()">Accueil données</button><h2>Scores par type de trou</h2><div class="stats">'+stats+'</div><h2>Historique</h2>'+(rows||'<p>Aucune carte enregistrée.</p>'));
}

<script>window.addEventListener('load',()=>slHome());
const rlGoalKey='swiinglab_real_goals_v1';
const rlGoals=()=>{try{return JSON.parse(localStorage.getItem(rlGoalKey)||'[]')}catch(e){return []}};
const rlRelative=r=>r.holes.reduce((a,h)=>a+h.shots-h.par,0);
const rlRoundTotal=r=>r.holes.reduce((a,h)=>a+h.shots,0);
function rlRecords(){
 const rounds=realGet().rounds;
 if(!rounds.length)return '<p>Aucun record tant qu’aucune partie n’est enregistrée.</p>';
 const best=n=>rounds.filter(r=>r.count===n).sort((a,b)=>rlRelative(a)-rlRelative(b))[0];
 const result=r=>r?rlRoundTotal(r)+' coups ('+(rlRelative(r)>0?'+':'')+rlRelative(r)+'), '+safe(r.golf)+' — '+safe(r.name):'—';
 const mostBirdies=Math.max(...rounds.map(r=>r.holes.filter(h=>h.shots<h.par).length));
 const longest=rounds.reduce((best,r)=>{let n=0,m=0;for(const h of r.holes){n=h.shots===h.par?n+1:0;m=Math.max(n,m)}return Math.max(best,m)},0);
 const byCourse=new Map();
 for(const r of rounds){const k=r.golf+' / '+r.name+' / '+r.count;let old=byCourse.get(k);if(!old||rlRelative(r)<rlRelative(old))byCourse.set(k,r)}
 return '<div class="info"><h3>Records personnels — parcours réels</h3><p>Meilleur 9 trous : '+result(best(9))+'</p><p>Meilleur 18 trous : '+result(best(18))+'</p><p>Birdies ou mieux sur une partie : '+mostBirdies+'</p><p>Plus longue série de pars : '+longest+'</p><h4>Meilleures cartes par parcours</h4>'+[...byCourse.values()].map(result).map(x=>'<p>'+x+'</p>').join('')+'</div>';
}
function rlGoalsPage(){
 const goals=rlGoals(),rs=realGet().rounds;
 const items=goals.map((g,i)=>{
  const matches=rs.filter(r=>r.count===g.count), recent=matches.slice(-5);
  const value=recent.length?recent.reduce((a,r)=>a+rlRoundTotal(r),0)/recent.length:null;
  const met=value!==null&&value<=g.target;
  return '<div class="histItem"><div><b>'+g.count+' trous — objectif '+g.target+' coups</b><small>Moyenne des '+recent.length+' dernières cartes de ce format : '+(value===null?'—':value.toFixed(1))+'</small><small>'+(value===null?'En attente de cartes':met?'Objectif atteint':'Encore '+(value-g.target).toFixed(1)+' coups à gagner en moyenne')+'</small></div><button class="secondary" onclick="rlRemoveGoal('+i+')">Supprimer</button></div>';
 }).join('');
 realUI('<h1>Objectifs de performance</h1><p>Les objectifs de score suivent séparément les vraies cartes de 9 ou 18 trous.</p><div class="info"><label>Format</label><select id="rlgCount"><option value="18">18 trous</option><option value="9">9 trous</option></select><label>Score cible, au maximum</label><input type="number" min="18" max="200" id="rlgTarget" placeholder="Ex. 90"><button onclick="rlAddGoal()">Ajouter un objectif</button></div>'+items+'<button class="secondary" onclick="realHome()">Retour</button>');
}
function rlAddGoal(){
 const count=+document.getElementById('rlgCount').value,target=+document.getElementById('rlgTarget').value;
 if(!Number.isInteger(target)||target<count||target>200)return alert('Indique un objectif de score valide.');
 const goals=rlGoals();goals.push({count,target});localStorage.setItem(rlGoalKey,JSON.stringify(goals));rlGoalsPage();
}
function rlRemoveGoal(i){const goals=rlGoals();goals.splice(i,1);localStorage.setItem(rlGoalKey,JSON.stringify(goals));rlGoalsPage()}
function rlComparison(){
 const rs=realGet().rounds;
 const months=[...new Set(rs.map(r=>(r.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
 if(months.length<2){realUI('<h1>Comparaison mensuelle</h1><p>Il faut des parties enregistrées sur deux mois différents.</p><button onclick="realHome()">Retour</button>');return}
 const selector=(id,v)=>'<select id="'+id+'" onchange="rlCompareRender()">'+months.map(m=>'<option value="'+m+'" '+(m===v?'selected':'')+'>'+m+'</option>').join('')+'</select>';
 realUI('<h1>Comparaison mensuelle</h1><p>Statistiques des parcours réels uniquement.</p><label>Mois A</label>'+selector('rlMonthA',months[1])+'<label>Mois B</label>'+selector('rlMonthB',months[0])+'<div id="rlCompareData"></div><button class="secondary" onclick="realHome()">Retour</button>');rlCompareRender();
}
function rlCompareRender(){
 const area=document.getElementById('rlCompareData'),selA=document.getElementById('rlMonthA'),selB=document.getElementById('rlMonthB');
 if(!area||!selA||!selB)return;
 const d=realGet().rounds,a=selA.value,b=selB.value;
 if(a===b){area.innerHTML='<p class="muted">Choisis deux mois différents pour comparer les performances.</p>';return}
 const summarise=m=>{
  const rounds=d.filter(x=>typeof x.date==='string'&&x.date.startsWith(m));
  const holes=rounds.flatMap(x=>x.holes||[]);
  const validPutts=holes.filter(x=>Number.isFinite(x.putts));
  const byFormat=n=>rounds.filter(x=>x.count===n);
  const meanScore=n=>{const rs=byFormat(n);return rs.length?rs.reduce((sum,x)=>sum+rlRoundTotal(x),0)/rs.length:null};
  return {parties:rounds.length,score9:meanScore(9),score18:meanScore(18),
   n9:byFormat(9).length,n18:byFormat(18).length,
   puts:validPutts.length?validPutts.reduce((sum,x)=>sum+x.putts,0)/validPutts.length:null,
   nPutts:validPutts.length,pars:holes.length?100*holes.filter(x=>x.shots===x.par).length/holes.length:null,nHoles:holes.length};
 };
 const A=summarise(a),B=summarise(b);
 const fmt=(v,unit='')=>v===null?'—':v.toFixed(1)+unit;
 const rows=[
  {label:'Parties enregistrées',key:'parties',better:null,nA:A.parties,nB:B.parties},
  {label:'Score moyen 9 trous',key:'score9',better:'down',nA:A.n9,nB:B.n9},
  {label:'Score moyen 18 trous',key:'score18',better:'down',nA:A.n18,nB:B.n18},
  {label:'Putts par trou renseigné',key:'puts',better:'down',nA:A.nPutts,nB:B.nPutts},
  {label:'Pars par trou',key:'pars',better:'up',unit:' %',nA:A.nHoles,nB:B.nHoles}
 ];
 const signed=v=>(v>0?'+':'')+v.toFixed(1);
 area.innerHTML='<div class="info"><div class="histItem"><b>Indicateur</b><b>'+safe(a)+' → '+safe(b)+'</b></div>'+
 rows.map(row=>{
  const x=A[row.key],y=B[row.key],unit=row.unit||'',comparable=x!==null&&y!==null;
  const diff=comparable?y-x:null;
  const trend=!comparable||!row.better?'':Math.abs(diff)<0.05?'Stable':(diff<0)===(row.better==='down')?'Amélioration':'Recul';
  const indicator=comparable?'<small>Variation : '+signed(diff)+unit+(trend?' · '+trend:'')+'</small>':'<small>Comparaison indisponible : données insuffisantes sur un des mois</small>';
  return '<div class="histItem"><div><b>'+row.label+'</b><small>Échantillons : '+row.nA+' / '+row.nB+'</small></div><div class="r">'+fmt(x,unit)+' → '+fmt(y,unit)+indicator+'</div></div>';
 }).join('')+'</div><p class="muted">Les scores des parties de 9 et 18 trous sont calculés séparément. Les putts non renseignés sont exclus. Une variation repose uniquement sur les données disponibles pour chaque mois.</p>';
}
function rlInsights(){
 const all=realGet().rounds.flatMap(r=>r.holes);
 if(!all.length){realUI('<h1>Points à travailler</h1><p>Ajoute des cartes de score pour obtenir une analyse.</p><button onclick="realHome()">Retour</button>');return}
 const byPar=[3,4,5].map(par=>{const a=all.filter(h=>h.par===par);return {par,n:a.length,over:a.length?a.reduce((s,h)=>s+h.shots-h.par,0)/a.length:null}}).filter(x=>x.n);
 const worst=byPar.slice().sort((a,b)=>b.over-a.over)[0],putts=all.filter(h=>h.putts!==null),pavg=putts.length?putts.reduce((s,h)=>s+h.putts,0)/putts.length:null;
 realUI('<h1>Points à travailler</h1><div class="info"><h3>Indicateurs des parcours réels</h3><p>Le type de trou avec le plus de coups au-dessus du par en moyenne est le <b>par '+worst.par+'</b> : '+worst.over.toFixed(2)+' coup(s) au-dessus du par sur '+worst.n+' trous.</p><p>Putts moyens : '+(pavg===null?'non renseignés':pavg.toFixed(2)+' sur '+putts.length+' trous documentés')+'</p><p class="muted">Ces scores indiquent où tes résultats sont les moins bons, mais ne permettent pas à eux seuls d’attribuer les coups perdus au drive, aux approches ou au putting.</p></div><button onclick="realHome()">Retour</button>');
}
